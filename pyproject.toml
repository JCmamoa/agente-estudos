[project]
name = "agente-estudos"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "google-adk>=2.13.0",
    "google-genai>=2.34.0",
    "python-dotenv>=1.2.4",
